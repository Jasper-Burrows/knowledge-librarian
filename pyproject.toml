[project]
name = "knowledge-librarian"
version = "1.0.0"
description = "A source-grounded knowledge assistant with an offline-first demo."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Jasper Burrows" }]
dependencies = [
  "aiosqlite>=0.22.1,<0.23",
  "fastapi>=0.141.1,<0.142",
  "httpx>=0.28,<0.29",
  "openai>=2.52,<3",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.14.2,<3",
  "pymupdf>=1.28,<2",
  "python-multipart>=0.0.32,<0.1",
  "structlog>=26.1,<27",
  "typer>=0.27,<0.28",
  "uvicorn[standard]>=0.52.1,<0.53",
]

[project.optional-dependencies]
pinecone = ["pinecone>=9.1,<10"]
slack = ["aiohttp>=3.13,<4", "slack-bolt>=1.30,<2"]
dev = [
  "mypy>=2.3,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7.1,<8",
  "respx>=0.23.1,<0.24",
  "ruff>=0.16.1,<0.17",
]

[project.scripts]
librarian = "knowledge_librarian.cli:app"

[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/knowledge_librarian"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --cov=knowledge_librarian --cov-report=term-missing --cov-report=xml"
markers = ["live: opt-in test that may call OpenAI only after explicit cost and key gates"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S106", "S108"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["knowledge_librarian"]
mypy_path = "backend/src"
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["knowledge_librarian"]

[tool.coverage.report]
fail_under = 80
show_missing = true
